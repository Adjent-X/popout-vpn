#!/usr/sbin/nft -f
# Popout VPN — Cloudflare-only HTTP/HTTPS on WAN (interface replaced at install).
# Only table inet raw. Never flush ruleset / never touch ip nat.

table inet raw {
	set cloudflare_v4 {
		type ipv4_addr
		flags interval
		auto-merge
		comment "Cloudflare published IPv4 ranges (ips-v4)"
	}

	chain prerouting {
		type filter hook prerouting priority raw; policy accept;
		iifname "eth0" tcp dport { 80, 443 } ip saddr @cloudflare_v4 counter accept
		iifname "eth0" tcp dport { 80, 443 } counter drop
	}
}
