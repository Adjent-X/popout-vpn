# Popout VPN — self-hosted MongoDB (localhost only)
# Low RAM, no WAN bind, fast local panel access.
# WiredTiger cache floor on MongoDB 7 is 0.25 GB — do not set lower.

storage:
  dbPath: /var/lib/mongodb
  wiredTiger:
    engineConfig:
      cacheSizeGB: 0.25
      journalCompressor: snappy
    collectionConfig:
      blockCompressor: snappy
    indexConfig:
      prefixCompression: true

systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod.log

net:
  port: 27017
  bindIp: 127.0.0.1
  maxIncomingConnections: 64

processManagement:
  timeZoneInfo: /usr/share/zoneinfo

# security:
#   authorization: enabled
# Enable after creating the popout Mongo user (installer can do this later).
